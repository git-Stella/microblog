#Continous delivery

name: Continuous delivery

on:
  push:
    tags:
      - '**'


jobs:
  test:
    uses: ./.github/workflows/ci.yml
    #prob don't even need to inherit anything but just in case later on it will...
    secrets: inherit
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Logga in på ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Bygg och pusha image till ghcr.io
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/git-stella/dv1677-ht26-grupp3-backend:latest