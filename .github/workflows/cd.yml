#Continous delivery

name: Continuous delivery

on:
  push:
    tags:
      - '**'


jobs:
  test:
    uses: ./.github/workflows/ci.yml
    #prob don't even need to inherit anything but just in case later on it will...
    secrets: inherit
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Logga in
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Bygg och pusha image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile_prod
          push: true
          tags: 0.0.9 #${{  }}